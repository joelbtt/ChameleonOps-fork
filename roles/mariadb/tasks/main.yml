---
- name: Instalar MariaDB, cliente y paquete de Python para MySQL
  zypper:
    name:
      - mariadb
      - mariadb-client
      - python3-mysqlclient
    state: present

- name: Iniciar y habilitar servicio MariaDB
  service:
    name: mariadb
    state: started
    enabled: true

- name: Crear base de datos de la aplicacion
  community.mysql.mysql_db:
    name: "app_mariadb"
    state: present
    login_unix_socket: /var/run/mysql/mysql.sock

- name: Crear usuario joel1234 con contrasena mundolibre restringido a localhost
  community.mysql.mysql_user:
    name: "joel1234"
    password: "mundolibre"
    priv: "app_mariadb.*:ALL"
    host: "localhost"
    state: present
    login_unix_socket: /var/run/mysql/mysql.sock
  no_log: true
