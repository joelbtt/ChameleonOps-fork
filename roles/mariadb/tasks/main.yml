- name: Crear base de datos de la aplicacion
  community.mysql.mysql_db:
    name: "app_db"
    state: present
    login_user: root
    login_password: "mundolibre"
    login_unix_socket: /var/run/mysql/mysql.sock
  ignore_errors: true

- name: Crear usuario de MariaDB con credenciales de la aplicacion
  community.mysql.mysql_user:
    name: "joel123"
    password: "mundolibre"
    priv: "*.*:ALL"
    host: "%"
    state: present
    login_user: root
    login_password: "mundolibre"
    login_unix_socket: /var/run/mysql/mysql.sock
  ignore_errors: true
